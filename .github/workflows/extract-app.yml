name: Extract app ZIP

on:
  push:
    paths:
      - 'qualify_ai_v03_ai_import.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app files
        run: |
          set -e

          mkdir -p /tmp/appfiles
          unzip -q qualify_ai_v03_ai_import.zip -d /tmp/appfiles

          INDEX=$(find /tmp/appfiles -name index.html -type f -print -quit)

          if [ -z "$INDEX" ]; then
            echo "index.html not found in ZIP"
            exit 1
          fi

          APPDIR=$(dirname "$INDEX")
          cp -R "$APPDIR"/. .

          rm -f qualify_ai_v03_ai_import.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Update app from ZIP"
          git push
