<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13243a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QUALIFY AI">
<title>QUALIFY AI</title>
<style>
:root{--navy:#13243a;--blue:#244766;--ink:#182536;--muted:#65758a;--bg:#f3f6fa;--card:#fff;--line:#dce4ed;--green:#16865b;--red:#b43c43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px 18px 20px}
header small{color:#c5d6e8;letter-spacing:.12em}header h1{margin:7px 0 4px;font-size:26px}header p{margin:0;color:#d5e1ed;font-size:13px}
main{max-width:760px;margin:auto;padding:14px 14px 92px}
nav{display:flex;gap:7px;overflow:auto;padding:12px 14px;background:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#edf2f7;color:#29415b;font-weight:650}
nav button.active{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #13243a0a}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:12px}
h2{font-size:19px;margin:8px 0 12px}h3{font-size:15px;margin:0 0 7px}
button,.btn{cursor:pointer}button.primary,.btn.primary{background:var(--navy);color:#fff;border:0;border-radius:11px;padding:12px 15px;font-weight:700}
button.secondary{background:#edf2f7;color:#233c57;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:650}
button.danger{background:#fff0f0;color:#a22d35;border:1px solid #f0c9cc;border-radius:10px;padding:9px 12px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{width:100%;border:1px solid #ccd7e3;border-radius:10px;padding:11px;background:#fff;font:inherit;color:var(--ink);margin:5px 0 12px}
textarea{min-height:86px;resize:vertical}
label{display:block;font-size:13px;font-weight:650;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;text-align:left}
.tile strong{display:block;margin-bottom:5px}.tile span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf1f8;color:#31506f;font-size:11px;font-weight:700}
.notice{background:#fff8e8;border:1px solid #f0dfb8;color:#6d5420;border-radius:12px;padding:12px;font-size:13px;line-height:1.55}
.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:11px;margin:8px 0}
.option input{width:auto;margin:2px 0 0}
.result{padding:12px;border-radius:11px;background:#eef6f1;margin-top:12px;line-height:1.6}
footer{color:var(--muted);font-size:11px;text-align:center;padding:20px}
.progress{height:7px;border-radius:9px;background:#e8edf3;overflow:hidden}.progress>i{display:block;height:100%;background:#27976d}
@media(min-width:620px){main{padding-top:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><small>PERSONAL CERTIFICATION TRAINING</small><h1>QUALIFY AI</h1><p>資格試験を、AIと攻略する。｜資料解析・AI問題作成対応</p></header>
<nav id="nav">
<button data-page="home" class="active">ホーム</button><button data-page="study">問題演習</button><button data-page="bank">問題管理</button><button data-page="settings">資格管理</button><button data-page="data">データ入出力</button><button data-page="ai">AI資料取込</button>
</nav>
<main id="app"></main>
<footer>QUALIFY AI v0.3 · AI資料解析には別途APIサーバーの設定が必要です。学習データは現在この端末のブラウザ内に保存されます。</footer>
<script src="app.js"></script>
</body></html>
